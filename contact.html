<main>

<div class="wrap"><section><h1>Contact us</h1><p>Fill in the form and your message opens in WhatsApp, ready to send.</p>
<form id="f"><div><label for="n">Your name</label><input id="n" required></div>
<div><label for="m">Message</label><textarea id="m" rows="5" required></textarea></div>
<button class="btn" type="submit">Send on WhatsApp</button></form></section></div>
<script>
// Replace with your WhatsApp number in international format, digits only (e.g. 923001234567)
var NUMBER="92XXXXXXXXXX";
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();
var t='Hello Shawl Style Hub, I am '+document.getElementById('n').value+'. '+document.getElementById('m').value;
window.open('https://wa.me/'+NUMBER+'?text='+encodeURIComponent(t),'_blank');});
</script>
</main>
